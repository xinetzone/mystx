name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm 依据 git 标签推算版本，浅克隆会让版本号退化
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package with test and doc extras
        # doc extra 提供 myst-parser：tests/test_myst.py 用 importorskip
        # 软依赖，装了才会真正执行 Markdown 主题路径的 4 个用例
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,doc]"
      - name: Run tests with coverage gate
        # 现行测试面为 tests/ 根下 7 个主题测试文件；tests/unit 与
        # tests/chaos 是旧包存档，pyproject 的 norecursedirs 已排除，
        # 裸 pytest 经 testpaths 自动锁定现行测试面，禁止显式传存档路径。
        # 门禁下限 90%：2026-11-26 本地实测 94%（346 语句 / 21 未覆盖），
        # 留 4 点波动余量；再上调前需先补 options/sidenotes 的未覆盖分支。
        run: |
          python -m pytest \
            --cov=mystx \
            --cov-report=term-missing \
            --cov-fail-under=90
