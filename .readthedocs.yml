# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  # ubuntu-24.04 是 Read the Docs 当前推荐的 LTS 构建镜像；
  # 不使用 ubuntu-26.04 + mambaforge-latest 组合——该镜像上的
  # mambaforge 工具链解析失败（asdf install 报
  # EnvironmentLocationNotFound: conda/latest，构建仅十余秒即失败，
  # 见 RTD build 35084329）。本项目仅需 pip 依赖（dev-environment.yml
  # 的 conda 环境实质也只安装 .[docs]），故直接使用 CPython。
  os: ubuntu-24.04
  tools:
    # 项目 requires-python >= 3.14，RTD 支持矩阵已提供 CPython 3.14
    python: "3.14"
    # You can also specify other tool versions:
    # nodejs: "16"
    # rust: "1.55"
    # golang: "1.17"

# Build documentation in the doc/ directory with Sphinx
sphinx:
   configuration: doc/conf.py
   # 警告即失败（等价 -W --keep-going）。
   # ⚠️ 本仓库 CI 的 `invoke build` 默认**不带** -W，所以这一行是把质量门
   # 抬高到与 RTD 一致，而不是对齐既有门禁；首次 RTD 构建若因既存警告变红，
   # 应先在 doc/conf.py 的 suppress_warnings 里逐条甄别，而不是直接回退这一行。
   fail_on_warning: true

# If using Sphinx, optionally build your docs in additional formats such as PDF
# Build PDF & ePub * HTML
formats:
  - htmlzip
  - epub
  - pdf

# Optionally declare the Python requirements required to build your docs
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
