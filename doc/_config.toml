# 站点配置：纯取值集中在此，机制（扩展装配、主题决策、环境分支、钩子）在 doc/conf.py。
# 由包内 mystx.config.runtime.ConfigManager 在 config-inited 合并进 Sphinx Config。

# ---- 站点元信息 ----
# 注意：language / locale_dirs / gettext_compact 必须留在 conf.py——
# Sphinx 在 config-inited 之前就要初始化 i18n，延迟合并会导致译文不加载。
project = "mystx"
author = "xinetzone"
copyright = "2026, xinetzone"

# ---- 外观与静态资源 ----
# README.md 面向仓库读者，站点根入口为 index.md
exclude_patterns = ["_build", "Thumbs.db", ".DS_Store", "README.md"]
html_static_path = ["_static"]
html_css_files = ["local.css", "font.css"]
html_last_updated_fmt = "%Y-%m-%d, %H:%M:%S"
templates_path = ["_templates"]
html_title = "Sphinx mystx Theme"
html_logo = "_static/images/logo.jpg"
html_favicon = "_static/images/favicon.jpg"
html_copy_source = true

# 用相对路径读本地清单：绝对 URL 会让 pydata 在构建期发请求校验，CI 阻网恒失败
version_switcher_json_url = "_static/switcher.json"

# ---- 站点专属的扩展配置 ----
comments_config = { hypothesis = true, utterances = { repo = "xinetzone/mystx", optional = "config" } }
ogp_site_url = "https://mystx.readthedocs.io/zh-cn/latest/"
ogp_social_cards = { site_url = "mystx.readthedocs.io", image = "_static/images/logo.jpg", font = "Maple Mono NF CN, SimHei, Microsoft YaHei", line_colors = "#4078c0" }

# 主题选项配置
[html_theme_options]
# 公告栏设置
announcement = "欢迎使用 mystx 主题！它是现代化文档主题。"

# 仓库相关设置
repository_url = "https://github.com/xinetzone/mystx"  # 仓库地址
use_repository_button = true  # 在页眉显示指向存储库的小 GitHub 徽标
repository_branch = "main"  # 仓库分支
use_source_button = true  # 显示 "查看源代码" 按钮
use_edit_page_button = true  # 显示 "编辑此页" 按钮
use_issues_button = true  # 显示 "报告问题" 按钮
path_to_docs = "doc"  # 文档目录路径

# 界面布局设置
secondary_sidebar_items = "page-toc.html"  # 次要侧边栏项目
toc_title = "目录"  # 目录标题
use_sidenotes = true  # 脚注转换为侧边注释/页边注释
show_navbar_depth = 1  # 导航栏显示深度
max_navbar_depth = 7  # 导航栏最大深度
collapse_navbar = false  # 折叠导航栏

# 按钮设置
use_download_button = true  # 使用下载按钮
use_fullscreen_button = true  # 使用全屏按钮

# 页脚设置
footer_content_items = "author.html, copyright.html, last-updated.html, extra-footer.html" # 页脚内容
# extra_footer = "额外的页脚信息"  # 额外的页脚内容
# 图标链接配置
icon_links = [
  { name = "知乎", url = "https://www.zhihu.com/people/xinetzone", icon = "fa-brands fa-zhihu", type = "fontawesome" },
  { name = "简书", url = "https://www.jianshu.com/u/4302480a3e8e", icon = "fa-solid fa-book", type = "fontawesome" },
  { name = "B站", url = "https://space.bilibili.com/252192181", icon = "fa-brands fa-bilibili", type = "fontawesome" },
  { name = "博客园", url = "https://www.cnblogs.com/q735613050/", icon = "https://xinetzone.github.io/xinetzone/media/xinetzone.jpg", type = "url" },
  { name = "领英", url = "https://www.linkedin.com/in/xinet", icon = "fa-brands fa-linkedin", type = "fontawesome" }
]

# 交互启动按钮配置(通过注释来移除按钮)
[html_theme_options.launch_buttons]
binderhub_url = "https://mybinder.org"
colab_url = "https://colab.research.google.com/"
deepnote_url = "https://deepnote.com/"
notebook_interface = "jupyterlab"
jupyterhub_url = "https://datahub.berkeley.edu" # For testing
