[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mystx"
dynamic = ["version"]
description = "mystx 主题 - 现代化 Sphinx 文档主题"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
authors = [
    {name = "xinetzone", email = "735613050@qq.com"}
]
maintainers = [
    {name = "xinetzone", email = "735613050@qq.com"}
]
keywords = [
    "mystx",
    "sphinx",
    "sphinx-theme",
    "documentation",
    "python"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Repository = "https://github.com/xinetzone/mystx"
Documentation = "https://mystx.readthedocs.io/"
Issues = "https://github.com/xinetzone/mystx/issues"

[project.entry-points."sphinx.html_themes"]
mystx = "mystx"

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "ablog",
    "ipywidgets",
    "numpy",
    "matplotlib",
    "sphinx-comments",
    "myst-nb",
    "nbclient",
    "pandas",
    "plotly",
    "sphinx-examples",
    "sphinx-contributors",
    "sphinx-thebe",
    "sphinxcontrib-bibtex",
    "sphinxext-opengraph",
    "sphinx-sitemap",
    "sphinx-autoapi>=3.4",
    "graphviz",
    "sphinx-tippy",
    "sphinx-pyscript",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "invoke>=2.0",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
]
build = [
    "build>=1.2",
    "scikit-build-core>=0.10",
]
tasks = [
    "invoke>=2.0",
    "invocations>=3.0",
]
dev = [
    "pdm",
    "typer>=0.12",
    "rich>=13.0",
    "packaging>=24.0",
    "tomli-w>=1.0",
    "invoke>=2.0",
    "sphinx>=8.0",
    "sphinx-intl",
    "myst-parser>=4.0",
    "myst-nb",
    "myst-docutils>=4.0",
    "docutils>=0.20",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
    "build>=1.2",
    "scikit-build-core>=0.10",
]

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "build"},
    {include-group = "tasks"},
    "pdm",
    "typer>=0.12",
    "rich>=13.0",
    "packaging>=24.0",
    "tomli-w>=1.0",
    "sphinx-intl",
]
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-book-theme>=1.1",
    "sphinx-design",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "ablog",
    "ipywidgets",
    "numpy",
    "matplotlib",
    "sphinx-comments",
    "myst-nb",
    "nbclient",
    "pandas",
    "plotly",
    "sphinx-examples",
    "sphinx-contributors",
    "sphinx-thebe",
    "sphinxcontrib-bibtex",
    "sphinxext-opengraph",
    "sphinx-sitemap",
    "sphinx-autoapi>=3.4",
    "graphviz",
    "sphinx-tippy",
    "sphinx-pyscript",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "invoke>=2.0",
]
lint = [
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
]
build = [
    "build>=1.2",
    "scikit-build-core>=0.10",
]
tasks = [
    "invoke>=2.0",
    "invocations>=3.0",
]

# ── scikit-build-core：mystx 纯 Python Sphinx 主题包 ──
# wheel.cmake=false/sdist.cmake=false 禁用 CMake（仓库无 CMakeLists.txt），
# 纯 Python 主题包构建全程无需 cmake/ninja，wheel 产出 py3-none-any。
[tool.scikit-build]
minimum-version = "0.10"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["README.md", "LICENSE", "pyproject.toml", "src/mystx"]
sdist.exclude = ["src/mystx/**/__pycache__/**", "src/mystx/**/*.pyc", "src/mystx/**/*.pyo"]
sdist.cmake = false

[tool.scikit-build.wheel]
cmake = false
packages = ["src/mystx"]

[tool.setuptools_scm]
version_file = "src/mystx/_version.py"
write_to = "src/mystx/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "build",
    "dist",
    ".git",
    "__pycache__",
    "*.egg-info",
    ".test-venv",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP",
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = [
    "build/",
    "dist/",
    ".test-venv/",
]

[tool.black]
line-length = 120
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
