{# 内容页脚：条目与顺序由 book/footer.py 决定，这里只按 type 输出。 #}
{%- set prefixes = {"author": _("By"), "copyright": "©", "last-updated": _("Last updated on")} %}
<div class="bd-footer__inner bd-page-width book-footer">
  {%- for item in book_footer %}
  <p class="book-footer__item book-footer__{{ item.type }}">{{ prefixes.get(item.type, "") }} {{ item.text }}</p>
  {%- endfor %}
</div>
