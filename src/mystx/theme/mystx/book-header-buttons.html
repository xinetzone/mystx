{# 页眉工具箱：按钮数据由 book/buttons.py 在 html-page-context 生成。 #}
{% if book_buttons %}
<div class="book-header-buttons" role="group" aria-label="{{ _('Page tools') }}">
  {%- for button in book_buttons %}
  {%- set icon %}<i class="{{ button.icon }}" aria-hidden="true"></i>{% endset %}
  {%- if button.javascript %}
  <button class="book-button" type="button" onclick="{{ button.javascript }}" title="{{ button.tooltip }}" aria-label="{{ button.label }}">{{ icon }}</button>
  {%- else %}
  <a class="book-button" href="{{ pathto(button.href, 1) }}"{% if button.download %} download{% else %} target="_blank" rel="noopener noreferrer"{% endif %} title="{{ button.tooltip }}" aria-label="{{ button.label }}">{{ icon }}</a>
  {%- endif %}
  {%- endfor %}
</div>
{% endif %}
